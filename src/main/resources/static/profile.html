<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile — SkillProof</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/></svg>">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .profile-header-card {
      background: linear-gradient(145deg, var(--bg-surface), var(--bg-surface-elevated));
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-6);
      position: relative;
    }
    .profile-hero {
      display: flex;
      gap: var(--space-5);
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-primary), #4338ca);
      color: white;
      font-size: var(--text-2xl);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--border-strong);
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }
    .profile-nav-tabs {
      display: flex;
      gap: var(--space-2);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: var(--space-5);
    }
    .profile-tab {
      padding: var(--space-2) var(--space-4);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .profile-tab.active {
      color: var(--color-primary-light);
      border-bottom-color: var(--color-primary);
    }
    .profile-tab:hover {
      color: var(--text-primary);
    }
    .interest-tag {
      display: inline-block;
      font-size: var(--text-xs);
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 2px 10px;
      border-radius: var(--radius-full);
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle navigation">
            <span data-icon="menu" data-icon-size="20"></span>
          </button>
          <h1 class="page-title-crumb">Developer Profile</h1>
        </div>
        <div class="topbar-right">
          <button class="icon-btn theme-toggle-btn" aria-label="Toggle theme"></button>
        </div>
      </header>

      <main class="page-container">
        <!-- Profile Header Card -->
        <div class="profile-header-card">
          <div class="profile-hero">
            <div id="user-avatar-large" class="profile-avatar-large">SP</div>

            <div style="flex: 1; min-width: 240px;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-3);">
                <div>
                  <div style="display: flex; align-items: center; gap: var(--space-2);">
                    <h2 id="prof-full-name" style="font-size: var(--text-2xl); font-weight: 800; color: var(--text-primary);"></h2>
                    <span id="prof-role-badge" class="badge badge-primary">STUDENT</span>
                  </div>
                  <div id="prof-username" style="font-size: var(--text-sm); color: var(--text-secondary); margin-top: 2px;"></div>
                </div>

                <div id="prof-actions" style="display: flex; gap: var(--space-2);">
                  <!-- Edit profile button rendered if own profile -->
                </div>
              </div>

              <div id="prof-headline" style="font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); margin-top: var(--space-2);"></div>
              <div id="prof-bio" style="font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.6; margin-top: var(--space-2); max-width: 720px; white-space: pre-line;"></div>

              <div id="prof-interests-container" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-3);"></div>

              <div id="prof-links" style="display: flex; gap: var(--space-4); margin-top: var(--space-4); font-size: var(--text-xs);">
                <!-- Social links -->
              </div>
            </div>
          </div>
        </div>

        <!-- Profile Tabs -->
        <div class="profile-nav-tabs">
          <button class="profile-tab active" data-tab="verified-tab">
            <span data-icon="award" data-icon-size="14"></span>
            <span>Verified Skills (<span id="verified-count">0</span>)</span>
          </button>
          <button class="profile-tab" data-tab="projects-tab">
            <span data-icon="folder-git-2" data-icon-size="14"></span>
            <span>Approved Projects (<span id="projects-count">0</span>)</span>
          </button>
          <button class="profile-tab" data-tab="reviews-tab">
            <span data-icon="message-square" data-icon-size="14"></span>
            <span>Mentor Reviews (<span id="reviews-count">0</span>)</span>
          </button>
        </div>

        <!-- Tab 1: Verified Skills -->
        <div id="verified-tab" class="tab-pane">
          <div id="verified-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4);"></div>
          <div id="verified-empty" style="display: none; padding: var(--space-8); text-align: center; background-color: var(--bg-surface); border-radius: var(--radius-lg);">
            <div class="empty-state-icon"><span data-icon="award" data-icon-size="36"></span></div>
            <p style="font-size: var(--text-sm); color: var(--text-secondary);">No verified skill credentials earned yet.</p>
          </div>
        </div>

        <!-- Tab 2: Approved Projects -->
        <div id="projects-tab" class="tab-pane" style="display: none;">
          <div id="projects-grid" style="display: grid; grid-template-columns: 1fr; gap: var(--space-4);"></div>
          <div id="projects-empty" style="display: none; padding: var(--space-8); text-align: center; background-color: var(--bg-surface); border-radius: var(--radius-lg);">
            <div class="empty-state-icon"><span data-icon="folder-git-2" data-icon-size="36"></span></div>
            <p style="font-size: var(--text-sm); color: var(--text-secondary);">No approved project submissions yet.</p>
          </div>
        </div>

        <!-- Tab 3: Mentor Reviews -->
        <div id="reviews-tab" class="tab-pane" style="display: none;">
          <div id="reviews-list" style="display: flex; flex-direction: column; gap: var(--space-4);"></div>
          <div id="reviews-empty" style="display: none; padding: var(--space-8); text-align: center; background-color: var(--bg-surface); border-radius: var(--radius-lg);">
            <div class="empty-state-icon"><span data-icon="message-square" data-icon-size="36"></span></div>
            <p style="font-size: var(--text-sm); color: var(--text-secondary);">No public mentor reviews published yet.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      replaceIcons();

      const currentUser = await SkillProof.fetchCurrentUser();
      if (currentUser) {
        SkillProof.renderAppSidebar('profile');
        SkillProof.initTopbar();
      } else {
        const sidebar = document.getElementById('app-sidebar');
        if (sidebar) sidebar.style.display = 'none';
        const topbarLeft = document.querySelector('.topbar-left');
        if (topbarLeft) {
          topbarLeft.innerHTML = `
            <a href="/index.html" class="brand-logo" style="display: flex; align-items: center; gap: 8px;">
              <div class="brand-icon" style="background-color: var(--color-primary); color: white; width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;">
                <span data-icon="shield" data-icon-size="16"></span>
              </div>
              <span style="font-weight: 700; font-size: var(--text-base);">SkillProof</span>
            </a>
          `;
        }
      }
      replaceIcons();

      const params = new URLSearchParams(window.location.search);
      const usernameParam = params.get('user');

      // Tab switching
      const tabs = document.querySelectorAll('.profile-tab');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          const target = tab.getAttribute('data-tab');
          document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
          document.getElementById(target).style.display = 'block';
        });
      });

      async function loadProfile() {
        try {
          let profileUrl = '/api/v1/profiles/me';
          if (usernameParam) {
            profileUrl = `/api/v1/profiles/${encodeURIComponent(usernameParam)}`;
          }

          const res = await SkillProof.apiFetch(profileUrl);
          const p = res.data;

          renderProfile(p);
        } catch (err) {
          showToast(err.message || 'Failed to load profile', 'error');
          document.querySelector('.page-container').innerHTML = `
            <div class="card" style="text-align: center; padding: var(--space-8);">
              <div class="empty-state-icon"><span data-icon="alert-circle" data-icon-size="36" style="color: var(--color-danger);"></span></div>
              <h2 style="font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-2);">Profile Not Found</h2>
              <p style="font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-4);">
                The requested developer profile does not exist or has been set to private.
              </p>
              <a href="/leaderboard.html" class="btn btn-secondary btn-sm">Return to Leaderboard</a>
            </div>
          `;
          replaceIcons();
        }
      }

      function renderProfile(p) {
        const initials = p.fullName ? 
          p.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() : 'SP';
        document.getElementById('user-avatar-large').textContent = initials;
        document.getElementById('prof-full-name').textContent = p.fullName;
        document.getElementById('prof-username').textContent = `@${p.username}`;
        document.getElementById('prof-role-badge').textContent = p.role;

        document.getElementById('prof-headline').textContent = p.headline || 'Software Developer & Problem Solver';
        document.getElementById('prof-bio').textContent = p.bio || 'Continuous learner mastering software engineering through hands-on practical challenges on SkillProof.';

        // Technical interests
        const interestsContainer = document.getElementById('prof-interests-container');
        if (p.technicalInterests) {
          const tags = p.technicalInterests.split(',').map(s => s.trim()).filter(Boolean);
          interestsContainer.innerHTML = tags.map(tag => `<span class="interest-tag">${tag}</span>`).join('');
        } else {
          interestsContainer.innerHTML = '';
        }

        // Links
        const linksContainer = document.getElementById('prof-links');
        let linksHtml = '';
        if (p.githubUrl) {
          linksHtml += `
            <a href="${p.githubUrl}" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; gap: 4px; color: var(--text-secondary); text-decoration: none;">
              <span data-icon="github" data-icon-size="14"></span>
              <span>GitHub</span>
            </a>
          `;
        }
        if (p.linkedinUrl) {
          linksHtml += `
            <a href="${p.linkedinUrl}" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; gap: 4px; color: var(--text-secondary); text-decoration: none;">
              <span data-icon="linkedin" data-icon-size="14"></span>
              <span>LinkedIn</span>
            </a>
          `;
        }
        linksContainer.innerHTML = linksHtml;

        // Edit profile button if current user is owner
        const actionsContainer = document.getElementById('prof-actions');
        if (currentUser && currentUser.username === p.username) {
          actionsContainer.innerHTML = `
            <a href="/settings.html" class="btn btn-secondary btn-sm">
              <span data-icon="edit" data-icon-size="14"></span>
              <span>Edit Profile</span>
            </a>
          `;
        }

        // Verified Skills Tab
        const verified = p.verifiedSkills || [];
        document.getElementById('verified-count').textContent = verified.length;
        const verifiedGrid = document.getElementById('verified-grid');
        const verifiedEmpty = document.getElementById('verified-empty');

        if (verified.length === 0) {
          verifiedEmpty.style.display = 'block';
          verifiedGrid.innerHTML = '';
        } else {
          verifiedEmpty.style.display = 'none';
          verifiedGrid.innerHTML = verified.map(vs => {
            const dateStr = vs.verifiedAt ? new Date(vs.verifiedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
            return `
              <div class="card" style="padding: var(--space-4); display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-2);">
                    <div style="display: flex; align-items: center; gap: var(--space-2);">
                      <div style="width: 32px; height: 32px; border-radius: var(--radius-sm); background-color: var(--bg-surface-elevated); display: flex; align-items: center; justify-content: center; color: var(--color-primary-light);">
                        <span data-icon="${vs.iconName || 'award'}" data-icon-size="16"></span>
                      </div>
                      <div>
                        <strong style="font-size: var(--text-sm);">${vs.skillName}</strong>
                        <div style="font-size: var(--text-xs); color: var(--text-muted);">${vs.skillCategory}</div>
                      </div>
                    </div>
                    <span class="badge badge-success" style="font-size: 9px;">VERIFIED</span>
                  </div>

                  <div style="background-color: var(--bg-canvas); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-xs); margin-top: var(--space-3); display: flex; flex-direction: column; gap: 2px;">
                    <div><span style="color: var(--text-muted);">Badge:</span> <code style="font-family: var(--font-mono); color: var(--accent-primary);">${vs.verificationBadgeCode}</code></div>
                    <div><span style="color: var(--text-muted);">Score:</span> <strong style="color: var(--color-success);">${vs.reviewScore}/100</strong></div>
                    <div><span style="color: var(--text-muted);">Verified:</span> ${dateStr}</div>
                  </div>
                </div>

                <div style="margin-top: var(--space-3);">
                  <a href="/verified.html?badge=${encodeURIComponent(vs.verificationBadgeCode)}" class="btn btn-secondary btn-sm" style="width: 100%;">
                    <span data-icon="shield-check" data-icon-size="14"></span>
                    <span>View Public Certificate</span>
                  </a>
                </div>
              </div>
            `;
          }).join('');
        }

        // Approved Projects Tab
        const projects = p.approvedProjects || [];
        document.getElementById('projects-count').textContent = projects.length;
        const projectsGrid = document.getElementById('projects-grid');
        const projectsEmpty = document.getElementById('projects-empty');

        if (projects.length === 0) {
          projectsEmpty.style.display = 'block';
          projectsGrid.innerHTML = '';
        } else {
          projectsEmpty.style.display = 'none';
          projectsGrid.innerHTML = projects.map(proj => {
            let links = '';
            if (proj.repositoryUrl) {
              links += `<a href="${proj.repositoryUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--color-primary-light); text-decoration: underline; font-size: var(--text-xs); display: inline-flex; align-items: center; gap: 4px;"><span data-icon="github" data-icon-size="12"></span> Repository</a>`;
            }
            if (proj.liveDemoUrl) {
              links += `<a href="${proj.liveDemoUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--color-primary-light); text-decoration: underline; font-size: var(--text-xs); display: inline-flex; align-items: center; gap: 4px; margin-left: var(--space-3);"><span data-icon="external-link" data-icon-size="12"></span> Live Demo</a>`;
            }

            return `
              <div class="card" style="padding: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-2);">
                  <div>
                    <h3 style="font-size: var(--text-base); font-weight: 700; color: var(--text-primary);">${proj.challengeTitle}</h3>
                    <span class="badge badge-neutral" style="margin-top: 4px;">${proj.skillName}</span>
                  </div>
                  <span class="badge badge-success">Approved (${proj.reviewScore || 100}/100)</span>
                </div>

                ${proj.explanation ? `<p style="font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.6; margin-top: var(--space-2);">${proj.explanation}</p>` : ''}

                <div style="margin-top: var(--space-3); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-subtle); padding-top: var(--space-2);">
                  <div>${links || '<span style="font-size: var(--text-xs); color: var(--text-muted);">Archive Verified</span>'}</div>
                  <span style="font-size: var(--text-xs); color: var(--text-muted);">${proj.submittedAt ? new Date(proj.submittedAt).toLocaleDateString() : ''}</span>
                </div>
              </div>
            `;
          }).join('');
        }

        // Mentor Reviews Tab
        const reviews = p.mentorReviews || [];
        document.getElementById('reviews-count').textContent = reviews.length;
        const reviewsList = document.getElementById('reviews-list');
        const reviewsEmpty = document.getElementById('reviews-empty');

        if (reviews.length === 0) {
          reviewsEmpty.style.display = 'block';
          reviewsList.innerHTML = '';
        } else {
          reviewsEmpty.style.display = 'none';
          reviewsList.innerHTML = reviews.map(rev => {
            const dateStr = rev.reviewedAt ? new Date(rev.reviewedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
            return `
              <div class="card" style="padding: var(--space-4);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
                  <div style="display: flex; align-items: center; gap: var(--space-2);">
                    <div class="user-avatar" style="width: 28px; height: 28px; font-size: 11px;">M</div>
                    <div>
                      <strong style="font-size: var(--text-sm);">${rev.mentorName}</strong>
                      <span style="font-size: var(--text-xs); color: var(--text-muted); margin-left: var(--space-2);">${dateStr}</span>
                    </div>
                  </div>
                  <span class="badge badge-success">${rev.totalScore}/100</span>
                </div>

                <div style="font-size: var(--text-xs); font-weight: 600; color: var(--text-secondary); margin-bottom: var(--space-1);">
                  Assessment for: <span style="color: var(--text-primary);">${rev.challengeTitle}</span>
                </div>

                <p style="font-size: var(--text-xs); color: var(--text-secondary); line-height: 1.6; background-color: var(--bg-surface-elevated); padding: var(--space-3); border-radius: var(--radius-md); font-style: italic;">
                  "${rev.generalFeedback}"
                </p>

                ${rev.improvementSuggestions ? `
                  <div style="margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted);">
                    <strong>Next Steps:</strong> ${rev.improvementSuggestions}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('');
        }

        replaceIcons();
      }

      await loadProfile();
    });
  </script>
</body>
</html>
